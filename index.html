  <!-- Initialize Mixpanel with your project token -->
  <script>
    mixpanel.init("14a5dde16c82389f68f9c05663dd2492");
    // Track page load event
    // Track page load Mixpanel
    mixpanel.track("Page Loaded", {
      page: window.location.pathname
    }, function () {
      document.getElementById("status").textContent = "✅ Page load event tracked!";
    });

    function identifyUser() {
      const userId = document.getElementById("user-id").value.trim();
      const name = document.getElementById("user-name").value.trim();
      const email = document.getElementById("user-email").value.trim();
      const accountName = document.getElementById("user-account-name").value.trim();
      const accountExternalId = document.getElementById("account-external-id").value.trim();

      if (!userId || !email || !name || !accountName || !accountExternalId) {
        document.getElementById("identify-status").textContent = "⚠️ Please fill out all fields.";
        return;
      }

      // Segment Identify Call
      analytics.identify(userId, {
      name: name,
      email: email,
      accountId: accountExternalId
      });

      // Segment Group Call
      analytics.group(accountExternalId, {
      name: accountName,
      industry: "Technology",
      employees: 329,
      plan: "enterprise",
      "total billed": 830
      });

      // Segment Track Call
      analytics.track("Segment Event", { 
        name: name, 
        networkId: accountExternalId
      });

      // Identify the user
      mixpanel.identify(userId);

      // Set traits
      mixpanel.people.set({
        $name: name,
        $email: email,
        $accountName: accountName,
        "Signup Date": new Date().toISOString()
      });

      document.getElementById("identify-status").textContent =
        `✅ Identified user "${userId}" at ${accountName}`;
    } 
  </script>
