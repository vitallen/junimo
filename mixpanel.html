  <style>
    [hidden] { display: none !important; }
    .stack { display: grid; gap: 12px; max-width: 720px; }
    .row { display: grid; grid-template-columns: 160px 1fr; gap: 8px; align-items: center; }
    input, button { padding: 10px; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #result { margin-top: 12px; margin-left: 20px; white-space: pre-wrap; }
    section.card { background: #fafafa; border: 1px solid #eee; padding: 16px; border-radius: 10px; max-width: 720px; margin-top: 1.5rem; margin-left: 20px; }
    section.card h2 { margin-bottom: 12px; }
    .traits { display: grid; gap: 8px; }
    .trait-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }
    .trait-row button { padding: 6px 10px; }
    .add-trait-btn { justify-self: start; }
    small.hint { opacity: 0.65; }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="mixpanel.html">Mixpanel</a></li>
      <li><a href="segment.html">Segment</a></li>
      <li><a href="analyticsapi.html">Analytics API</a></li>
      <li><a href="amplitude.html">Amplitude</a></li>
      <li class="logo"><img src="vital_logo.png" alt="Vital logo" /></li>
    </ul>
  </nav>

  <h1>Mixpanel Playground</h1>

  <!-- Identify -->
  <section class="card">
    <h2>Identify</h2>
    <div class="stack">
      <div class="row">
        <label for="identify-user-id">User ID</label>
        <input id="identify-user-id" type="text" placeholder="e.g. user_456" />
      </div>
      <div class="row">
        <label for="identify-name">Name <small class="hint">(optional)</small></label>
        <input id="identify-name" type="text" placeholder="e.g. Richard Hendricks" />
      </div>
      <div class="row">
        <label for="identify-email">Email <small class="hint">(optional)</small></label>
        <input id="identify-email" type="email" placeholder="e.g. richard@piedpiper.com" />
      </div>
      <div class="row">
        <label for="identify-account-id">Account ID <small class="hint">(optional)</small></label>
        <input id="identify-account-id" type="text" placeholder="e.g. acct_123" />
      </div>
      <div class="row">
        <label for="identify-account-name">Account Name <small class="hint">(optional)</small></label>
        <input id="identify-account-name" type="text" placeholder="e.g. Pied Piper" />
      </div>

      <div class="traits" id="identify-traits"></div>
      <button type="button" class="add-trait-btn" data-add-trait="identify-traits">+ Add Trait</button>

      <div class="btns">
        <button id="btn-identify" type="button">Send Identify</button>
      </div>
    </div>
  </section>

  <!-- Track -->
  <section class="card">
    <h2>Track</h2>
    <div class="stack">
      <div class="row">
        <label for="track-event">Event Name</label>
        <input id="track-event" type="text" placeholder="Mixpanel Event" />
      </div>

      <div class="traits" id="track-props"></div>
      <button type="button" class="add-trait-btn" data-add-trait="track-props">+ Add Property</button>

      <div class="btns">
        <button id="btn-track" type="button">Send Track</button>
      </div>
    </div>
  </section>

  <pre id="result"></pre>

  <script>
    const $ = (id) => document.getElementById(id);
    const out = (msg, obj) => {
      const stamp = new Date().toISOString();
      const details = obj ? "\n" + JSON.stringify(obj, null, 2) : "";
      $("result").textContent = `[${stamp}] ${msg}${details}`;
    };

    function safeCall(label, fn) {
      try { fn && fn(); }
      catch (e) { out(`❌ ${label} error`, { error: String(e) }); }
    }

    // --- Trait / property key-value rows ---
    function addTraitRow(containerId) {
      const container = $(containerId);
      const row = document.createElement("div");
      row.className = "trait-row";
      row.innerHTML = `
        <input type="text" placeholder="key" class="trait-key" />
        <input type="text" placeholder="value" class="trait-value" />
        <button type="button" title="Remove">×</button>
      `;
      row.querySelector("button").onclick = () => row.remove();
      container.appendChild(row);
    }

    document.querySelectorAll("[data-add-trait]").forEach((btn) => {
      btn.onclick = () => addTraitRow(btn.getAttribute("data-add-trait"));
    });

    function collectTraits(containerId) {
      const rows = $(containerId).querySelectorAll(".trait-row");
      const traits = {};
      rows.forEach((row) => {
        const key = row.querySelector(".trait-key").value.trim();
        const value = row.querySelector(".trait-value").value.trim();
        if (key) traits[key] = value;
      });
      return traits;
    }

    // --- Identify (mixpanel.identify + mixpanel.people.set) ---
    $("btn-identify").onclick = function () {
      const userId = $("identify-user-id").value.trim();
      if (!userId) { out("⚠️ User ID is required — not sending mixpanel.identify"); return; }
      const name = $("identify-name").value.trim();
      const email = $("identify-email").value.trim();
      const accountId = $("identify-account-id").value.trim();
      const accountName = $("identify-account-name").value.trim();
      const traits = collectTraits("identify-traits");
      if (name) traits.$name = name;
      if (email) traits.$email = email;
      if (accountId) traits.$accountId = accountId;
      if (accountName) traits.$accountName = accountName;

      safeCall("mixpanel.identify", () => mixpanel.identify(userId));
      if (Object.keys(traits).length) {
        safeCall("mixpanel.people.set", () => mixpanel.people.set(traits));
      }
      out("✅ Sent mixpanel.identify", { userId, traits });
    };

    // --- Track ---
    $("btn-track").onclick = function () {
      const event = $("track-event").value.trim() || "Mixpanel Event";
      const properties = { source: "mixpanel.html", ...collectTraits("track-props") };
      safeCall("mixpanel.track", () => mixpanel.track(event, properties));
      out("✅ Sent mixpanel.track", { event, properties });
    };
  </script>
</body>
</html>
